<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>@font-face{font-family:SUIT;src:url('/fonts/SUIT-Regular.otf')}body{background:#08090d;margin:0;padding:24px;color:white;font-family:SUIT}#view{max-width:900px;aspect-ratio:8/5;margin:10px auto}nav{max-width:900px;margin:auto;display:flex;flex-wrap:wrap;gap:5px}button{font:12px SUIT;padding:6px;border:1px solid #4f4560;background:#1b1429;color:#c7b9de;border-radius:4px}input{display:block;width:900px;max-width:95%;margin:15px auto}</style></head><body><nav id="nav"></nav><main id="view"></main><input id="progress" aria-label="모션 시점" type="range" min="0" max="1" step=".01" value=".75"><script type="module">import {createPdfScene} from '/src/pdf-scenes.js';import {pdfTools} from '/src/catalog.js';const host=document.querySelector('#view');let renderer;window.items=pdfTools;window.show=(id,p=.75)=>{renderer?.destroy();const item=pdfTools.find(x=>x.id===id)||pdfTools[0];renderer=createPdfScene(host,item);renderer.render(p);window.current=renderer;document.querySelector('#progress').value=p;};document.querySelector('#nav').innerHTML=pdfTools.map(x=>`<button data-id="${x.id}">${x.label}</button>`).join('');document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id));document.querySelector('#progress').oninput=e=>renderer.render(Number(e.target.value));show('highlight');</script></body></html>
